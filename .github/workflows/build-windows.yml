name: Build VProxies Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build and package
        shell: powershell
        run: .\build-windows.ps1

      - name: Create installer checksum
        shell: powershell
        run: |
          $file = "artifacts/VProxiesSetup-1.0.2-win-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VProxiesSetup-1.0.2-win-x64.exe" | Set-Content "$file.sha256" -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VProxiesSetup-1.0.2-win-x64
          path: |
            artifacts/VProxiesSetup-1.0.2-win-x64.exe
            artifacts/VProxiesSetup-1.0.2-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release for this version
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.2"
          $installer = "artifacts/VProxiesSetup-1.0.2-win-x64.exe"
          $checksum = "$installer.sha256"
          $previousErrorAction = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $previousErrorAction
          if ($releaseExists) {
            gh release upload $tag $installer $checksum --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer $checksum --target $env:GITHUB_SHA --title "VProxies 1.0.2" --generate-notes --repo $env:GITHUB_REPOSITORY
          }
