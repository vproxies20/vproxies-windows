name: Build VProxies Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build and package
        shell: powershell
        run: .\build-windows.ps1

      - name: Create installer checksum
        shell: powershell
        run: |
          $file = "artifacts/VProxiesSetup-1.0.2-win-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VProxiesSetup-1.0.2-win-x64.exe" | Set-Content "$file.sha256" -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VProxiesSetup-1.0.2-win-x64
          path: |
            artifacts/VProxiesSetup-1.0.2-win-x64.exe
            artifacts/VProxiesSetup-1.0.2-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
